server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2

            - id: pipeline-service
              uri: lb://pipeline-service
              predicates:
                - Path=/api/pipelines/**
              filters:
                - StripPrefix=2

            - id: model-service
              uri: lb://model-service
              predicates:
                - Path=/api/models/**
              filters:
                - StripPrefix=2

            - id: dataset-service
              uri: lb://dataset-service
              predicates:
                - Path=/api/datasets/**
              filters:
                - StripPrefix=2

            - id: monitoring-service
              uri: lb://monitoring-service
              predicates:
                - Path=/api/monitoring/**
              filters:
                - StripPrefix=2

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=2

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_URL:http://localhost:4300}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers: '*'
                allow-credentials: true
                max-age: 3600

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/nexusml}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/nexusml/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
