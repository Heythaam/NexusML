server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pipeline-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexusml_pipeline}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/nexusml}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/nexusml/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

airflow:
  url: ${AIRFLOW_URL:http://localhost:8080}
  username: ${AIRFLOW_USERNAME:admin}
  password: ${AIRFLOW_PASSWORD:admin123}
  dag-id: ${AIRFLOW_DAG_ID:talys_mlops_pipeline}
  poll-interval-seconds: ${POLL_INTERVAL_SECONDS:5}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
